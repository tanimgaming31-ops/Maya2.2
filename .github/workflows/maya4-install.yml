name: Install and Build Maya 4 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install_build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current Maya project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Prepare Android SDK platform
        run: sdkmanager --install 'platforms;android-35'
       python-version: '3.11'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Maya 4 modules in existing index with backup
        run: python maya4_install.py
      - name: Validate Maya 4 code
        run: |
          node --check maya4.js
          python -m py_compile maya4_install.py
          test -s index.html
      - name: Prepare Maya web assets including VRM
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png maya4.js maya4.css www/
          if [ -f maya.vrm ]; then cp maya.vrm www/; fi
          if [ -f maya-butterfly-rigged.glb ]; then cp maya-butterfly-rigged.glb www/; fi
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android app
        run: npx cap add android
      - name: Set up existing Maya Android native controls
        run: bash setup-native.sh
      - name: Preserve microphone and camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          for name in ('RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','CAMERA'):
              v='android.permission.'+name
              if 'android:name="'+v+'"' not in s:
                  s=s.replace('<application','    <uses-permission android:name="'+v+'" />\n    <application',1)
          p.write_text(s)
          PY
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Name Maya 4 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Maya-4.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-4-Android-APK
          path: Maya-4.apk
          if-no-files-found: error
      - name: Save the tested index update to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js index-before-maya4.html
          if ! git diff --cached --quiet; then
            git commit -m "Maya 4 add-ons (Android build verified)"
            git push
          fi
      - name: Publish the Maya 4 debug APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="maya4-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" Maya-4.apk --title "Maya 4 Android $TAG" --notes "Maya 4 add-ons for the existing com.tanim.maya2 app. Some Android features require permissions and device testing."
